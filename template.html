<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NebulaOS — Browser Operating System</title><link rel="icon" href="data:,">
<style>
/* ============ THEME TOKENS ============ */
:root {
  --radius: 12px;
  --dock-h: 64px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
}
html[data-theme="dark"] {
  --bg-accent-a: #1b2a5e; --bg-accent-b: #0d1024; --bg-accent-c: #2b1055;
  --wall: radial-gradient(1200px 800px at 15% 10%, rgba(90,120,255,.35), transparent 60%),
          radial-gradient(1000px 700px at 85% 90%, rgba(180,60,220,.28), transparent 60%),
          linear-gradient(160deg, var(--bg-accent-a), var(--bg-accent-b) 55%, var(--bg-accent-c));
  --win-bg: rgba(28,30,38,.92);
  --win-border: rgba(255,255,255,.10);
  --titlebar: rgba(40,43,54,.95);
  --panel: #232631;
  --panel-2: #1b1e27;
  --text: #e8eaf0;
  --text-dim: #9aa1b2;
  --accent: #4f8cff;
  --accent-2: #8a5cff;
  --hover: rgba(255,255,255,.08);
  --active: rgba(79,140,255,.22);
  --shadow: 0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --dock-bg: rgba(22,24,32,.72);
  --menu-bg: rgba(24,26,34,.92);
  --input-bg: #15171f;
  --border-soft: rgba(255,255,255,.09);
  --danger: #ff5f57; --warn: #febc2e; --ok: #28c840;
}
html[data-theme="light"] {
  --bg-accent-a: #dbe7ff; --bg-accent-b: #f3f5fb; --bg-accent-c: #f0dcff;
  --wall: radial-gradient(1200px 800px at 15% 10%, rgba(80,130,255,.30), transparent 60%),
          radial-gradient(1000px 700px at 85% 90%, rgba(200,90,255,.22), transparent 60%),
          linear-gradient(160deg, var(--bg-accent-a), var(--bg-accent-b) 55%, var(--bg-accent-c));
  --win-bg: rgba(252,252,254,.96);
  --win-border: rgba(0,0,0,.12);
  --titlebar: rgba(238,240,246,.98);
  --panel: #ffffff;
  --panel-2: #eef0f5;
  --text: #1c2230;
  --text-dim: #5d6678;
  --accent: #2563eb;
  --accent-2: #7c3aed;
  --hover: rgba(0,0,0,.06);
  --active: rgba(37,99,235,.16);
  --shadow: 0 18px 44px rgba(30,40,80,.22), 0 2px 6px rgba(30,40,80,.12);
  --dock-bg: rgba(255,255,255,.65);
  --menu-bg: rgba(250,251,253,.94);
  --input-bg: #ffffff;
  --border-soft: rgba(0,0,0,.10);
  --danger: #e5484d; --warn: #d99100; --ok: #2fa84f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); color: var(--text); background: #000; user-select: none; -webkit-user-select: none; }
::selection { background: var(--accent); color: #fff; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(128,128,128,.45); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ WALLPAPER / DESKTOP ============ */
#wallpaper { position: fixed; inset: 0; background: var(--wall); transition: background .5s ease; }
#desktop { position: fixed; inset: 0 0 var(--dock-h) 0; }
#icon-layer { position: absolute; inset: 0; padding: 14px; }
.desk-icon { position: absolute; width: 92px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 5px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.desk-icon:hover { background: var(--hover); }
.desk-icon.selected { background: var(--active); border-color: var(--accent); }
.desk-icon.dragging { opacity: .55; }
.desk-icon .ic { width: 52px; height: 52px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); pointer-events: none; }
.desk-icon .lbl { font-size: 12px; text-align: center; line-height: 1.15; max-width: 90px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.85); word-break: break-word; pointer-events: none; }
html[data-theme="light"] .desk-icon .lbl { color: #16203a; text-shadow: 0 1px 2px rgba(255,255,255,.85); }

/* ============ WINDOWS ============ */
.window { position: absolute; min-width: 320px; min-height: 200px; background: var(--win-bg); border: 1px solid var(--win-border); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: opacity .15s, transform .15s; }
.window.maximized { border-radius: 0; }
.window.minimized { opacity: 0; transform: scale(.6) translateY(120px); pointer-events: none; }
.window.closing { opacity: 0; transform: scale(.92); }
.titlebar { height: 38px; flex: 0 0 38px; background: var(--titlebar); display: flex; align-items: center; gap: 8px; padding: 0 10px; cursor: default; border-bottom: 1px solid var(--border-soft); }
.window:not(.focused) .titlebar { opacity: .75; }
.tb-title { font-size: 13px; font-weight: 600; margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-app-ic { width: 16px; height: 16px; flex: 0 0 16px; }
.win-btns { margin-left: auto; display: flex; gap: 8px; }
.win-btn { width: 13px; height: 13px; border-radius: 50%; border: none; cursor: pointer; padding: 0; position: relative; }
.win-btn svg { position: absolute; inset: 0; opacity: 0; }
.win-btns:hover .win-btn svg { opacity: .55; }
.btn-close { background: var(--danger); } .btn-min { background: var(--warn); } .btn-max { background: var(--ok); }
.win-body { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--win-bg); }
.resizer { position: absolute; z-index: 5; }
.rz-e { right: 0; top: 10px; bottom: 10px; width: 6px; cursor: ew-resize; }
.rz-s { bottom: 0; left: 10px; right: 10px; height: 6px; cursor: ns-resize; }
.rz-se { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.rz-w { left: 0; top: 10px; bottom: 10px; width: 6px; cursor: ew-resize; }

/* ============ DOCK / TASKBAR ============ */
#dock { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); height: calc(var(--dock-h) - 8px); display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--dock-bg); border: 1px solid var(--border-soft); border-radius: 18px; box-shadow: var(--shadow); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); z-index: 90000; max-width: 96vw; }
.dock-item { position: relative; width: 46px; height: 46px; border: none; background: transparent; cursor: pointer; padding: 2px; border-radius: 12px; transition: transform .12s ease; }
.dock-item:hover { transform: translateY(-7px) scale(1.12); background: var(--hover); }
.dock-item svg { width: 100%; height: 100%; }
.dock-item .dot { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); opacity: 0; }
.dock-item.running .dot { opacity: 1; }
.dock-item.focused .dot { opacity: 1; background: var(--accent); width: 16px; border-radius: 3px; }
.dock-sep { width: 1px; height: 34px; background: var(--border-soft); margin: 0 4px; }
#clock { margin-left: 8px; text-align: right; padding: 0 10px; cursor: pointer; border-radius: 10px; line-height: 1.2; border: none; background: transparent; color: var(--text); font-family: var(--font); }
#clock:hover { background: var(--hover); }
#clock-time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; display: block; }
#clock-date { font-size: 10.5px; color: var(--text-dim); display: block; }
#start-btn.active { background: var(--active); }

.dock-item[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: var(--menu-bg); color: var(--text); border: 1px solid var(--border-soft); padding: 4px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; backdrop-filter: blur(10px); pointer-events: none; box-shadow: var(--shadow); z-index: 2; }

/* ============ START MENU ============ */
#start-menu { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 10px); transform: translateX(-50%) translateY(14px); width: 540px; max-width: 94vw; max-height: 62vh; background: var(--menu-bg); border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 89999; display: flex; flex-direction: column; overflow: hidden; }
#start-menu.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#start-search-wrap { padding: 14px 16px 8px; }
#start-search { width: 100%; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border-soft); background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; font-family: var(--font); }
#start-search:focus { border-color: var(--accent); }
#start-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 12px 14px; overflow-y: auto; }
.start-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 12px; cursor: pointer; border: none; background: transparent; color: var(--text); }
.start-tile:hover { background: var(--hover); }
.start-tile svg { width: 40px; height: 40px; }
.start-tile span { font-size: 11.5px; text-align: center; }
.start-cat { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-dim); padding: 10px 8px 2px; }

/* ============ CONTEXT MENU ============ */
.ctx-menu { position: fixed; min-width: 216px; background: var(--menu-bg); border: 1px solid var(--border-soft); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); padding: 6px; z-index: 95000; animation: ctxin .12s ease; }
@keyframes ctxin { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.ctx-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: none; background: transparent; color: var(--text); font-size: 13px; border-radius: 8px; cursor: pointer; text-align: left; font-family: var(--font); }
.ctx-item:hover { background: var(--accent); color: #fff; }
.ctx-item .sub { margin-left: auto; color: var(--text-dim); font-size: 11px; }
.ctx-item:hover .sub { color: rgba(255,255,255,.8); }
.ctx-sep { height: 1px; background: var(--border-soft); margin: 5px 8px; }
.swatch-row { display: flex; gap: 6px; padding: 4px 12px 8px; }
.swatch { width: 36px; height: 24px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
.swatch.active { border-color: var(--accent); }
.ctx-label { font-size: 11px; color: var(--text-dim); padding: 6px 12px 4px; text-transform: uppercase; letter-spacing: .6px; }

/* ============ SHARED APP UI ============ */
.app-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel-2); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
.btn { padding: 6px 13px; border-radius: 8px; border: 1px solid var(--border-soft); background: var(--panel); color: var(--text); font-size: 12.5px; cursor: pointer; font-family: var(--font); transition: background .12s, transform .06s; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.12); background: var(--accent); }
.btn.danger { color: var(--danger); }
.text-input { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border-soft); background: var(--input-bg); color: var(--text); font-size: 13px; outline: none; font-family: var(--font); }
.text-input:focus { border-color: var(--accent); }
.status-bar { flex: 0 0 auto; padding: 5px 12px; font-size: 11.5px; color: var(--text-dim); background: var(--panel-2); border-top: 1px solid var(--border-soft); display: flex; gap: 16px; }
.scroll-area { flex: 1; overflow-y: auto; }

/* ============ FILE BROWSER ============ */
.fb-side { flex: 0 0 160px; border-right: 1px solid var(--border-soft); background: var(--panel-2); padding: 8px; overflow-y: auto; }
.fb-side-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--text-dim); }
.fb-side-item:hover { background: var(--hover); color: var(--text); }
.fb-side-item.active { background: var(--active); color: var(--text); }
.fb-side-item svg { width: 16px; height: 16px; flex: 0 0 16px; }
.fb-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.fb-crumbs { display: flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 2px 4px; flex-wrap: wrap; }
.crumb { padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--text-dim); }
.crumb:hover { background: var(--hover); color: var(--text); }
.crumb.cur { color: var(--text); font-weight: 600; }
.fb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; padding: 12px; align-content: start; flex: 1; overflow-y: auto; }
.fb-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.fb-item:hover { background: var(--hover); }
.fb-item.sel { background: var(--active); border-color: var(--accent); }
.fb-item svg { width: 42px; height: 42px; }
.fb-item span { font-size: 11.5px; text-align: center; word-break: break-word; line-height: 1.2; }
.fb-preview { flex: 0 0 38%; border-top: 1px solid var(--border-soft); background: var(--panel-2); padding: 12px 16px; overflow-y: auto; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--text-dim); user-select: text; -webkit-user-select: text; }
.fb-preview .pv-title { font-family: var(--font); font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 8px; }

/* ============ NOTES ============ */
.notes-list { flex: 0 0 190px; border-right: 1px solid var(--border-soft); background: var(--panel-2); overflow-y: auto; padding: 8px; }
.note-card { padding: 9px 11px; border-radius: 9px; cursor: pointer; margin-bottom: 5px; border: 1px solid transparent; }
.note-card:hover { background: var(--hover); }
.note-card.sel { background: var(--active); border-color: var(--accent); }
.note-card b { display: block; font-size: 12.5px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-card small { font-size: 10.5px; color: var(--text-dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notes-editor { flex: 1; display: flex; flex-direction: column; }
.notes-editor textarea { flex: 1; width: 100%; border: none; outline: none; resize: none; background: var(--win-bg); color: var(--text); padding: 16px 20px; font-family: var(--mono); font-size: 13.5px; line-height: 1.6; user-select: text; -webkit-user-select: text; }

/* ============ MAIL ============ */
.mail-list { flex: 0 0 280px; border-right: 1px solid var(--border-soft); overflow-y: auto; background: var(--panel-2); }
.mail-row { padding: 11px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.mail-row:hover { background: var(--hover); }
.mail-row.sel { background: var(--active); }
.mail-row .from { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.mail-row .from .t { font-weight: 400; font-size: 10.5px; color: var(--text-dim); flex: 0 0 auto; }
.mail-row .subj { font-size: 12.5px; margin: 2px 0; }
.mail-row .prev { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mail-row.unread .subj, .mail-row.unread .from { color: var(--accent); }
.mail-row.unread .subj::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.mail-read { flex: 1; overflow-y: auto; padding: 22px 26px; }
.mail-read h2 { font-size: 18px; margin-bottom: 6px; }
.mail-read .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft); }
.mail-read .body-txt { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
.mail-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 13px; flex-direction: column; gap: 10px; }
.modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .15s; }
.modal.show { opacity: 1; pointer-events: auto; }
.modal-card { width: min(440px, 90%); background: var(--panel); border: 1px solid var(--border-soft); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.modal-card h3 { font-size: 15px; }

/* ============ CALENDAR ============ */
.cal-wrap { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 8px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head h2 { font-size: 17px; }
.cal-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; padding: 4px 0; }
.cal-cell { border: 1px solid var(--border-soft); border-radius: 8px; padding: 5px 7px; font-size: 12.5px; cursor: pointer; position: relative; background: var(--panel); overflow: hidden; }
.cal-cell:hover { border-color: var(--accent); }
.cal-cell.other { opacity: .35; }
.cal-cell.today { background: var(--accent); color: #fff; font-weight: 700; border-color: var(--accent); }
.cal-cell.sel { outline: 2px solid var(--accent-2); }
.cal-cell .evt-dot { position: absolute; bottom: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.cal-day-panel { flex: 0 0 auto; border-top: 1px solid var(--border-soft); padding: 10px 14px; min-height: 74px; }
.cal-day-panel h4 { font-size: 12.5px; margin-bottom: 6px; }
.cal-ev { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; }
.cal-ev:hover { background: var(--hover); }
.cal-ev button { margin-left: auto; border: none; background: none; color: var(--danger); cursor: pointer; font-size: 12px; }

/* ============ TERMINAL / ASSISTANT ============ */
.term { flex: 1; overflow-y: auto; padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--panel-2); user-select: text; -webkit-user-select: text; }
.term-line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
.term-line.sys { color: var(--text-dim); }
.term-line.err { color: var(--danger); }
.term-line.ok { color: var(--ok); }
.term-line.hdr { color: var(--accent); font-weight: 700; }
.term-line.acc { color: var(--accent-2); }
.term-input-row { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border-soft); background: var(--panel-2); }
.term-prompt { font-family: var(--mono); color: var(--ok); font-size: 13px; }
.term-input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-family: var(--mono); font-size: 13px; }
.term-input-row input::placeholder { color: var(--text-dim); }

/* ============ CALCULATOR (special feature) ============ */
.calc { flex: 1; display: flex; flex-direction: column; background: var(--panel-2); }
.calc-screen { padding: 18px 18px 8px; text-align: right; }
.calc-expr { font-size: 13px; color: var(--text-dim); min-height: 18px; font-family: var(--mono); word-break: break-all; }
.calc-acc { font-size: 34px; font-weight: 300; font-variant-numeric: tabular-nums; word-break: break-all; min-height: 44px; }
.calc-history { flex: 0 0 92px; overflow-y: auto; border-top: 1px solid var(--border-soft); padding: 6px 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.calc-history div { padding: 2px 0; cursor: pointer; }
.calc-history div:hover { color: var(--text); }
.calc-keys { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px; }
.calc-key { border: 1px solid var(--border-soft); border-radius: 10px; background: var(--panel); color: var(--text); font-size: 16px; cursor: pointer; transition: filter .1s, transform .05s; font-family: var(--font); }
.calc-key:hover { background: var(--hover); }
.calc-key:active { transform: scale(.94); }
.calc-key.op { color: var(--accent); font-weight: 600; }
.calc-key.fn { color: var(--accent-2); font-size: 13px; }
.calc-key.eq { background: var(--accent); color: #fff; border-color: var(--accent); }
.calc-key.mem { color: var(--warn); font-size: 12.5px; }

/* ============ ABOUT ============ */
.about { flex: 1; overflow-y: auto; padding: 26px 30px; }
.about h1 { font-size: 26px; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.about h1 svg { width: 40px; height: 40px; }
.about .ver { color: var(--text-dim); font-size: 12.5px; margin-bottom: 20px; }
.about h3 { margin: 18px 0 8px; font-size: 14px; color: var(--accent); }
.about p, .about li { font-size: 13px; line-height: 1.65; color: var(--text); user-select: text; -webkit-user-select: text; }
.about ul { padding-left: 22px; }
.about kbd { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--border-soft); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
.about .card { background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 18px; margin: 10px 0; }

/* game frame */
.game-frame { flex: 1; display: flex; align-items: center; justify-content: center; background: #10121a; position: relative; overflow: hidden; }
.game-frame canvas { display: block; }
.game-hud { position: absolute; top: 8px; left: 12px; font-family: var(--mono); font-size: 12px; color: #9fe8a8; text-shadow: 0 1px 2px #000; pointer-events: none; }
.game-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(6,8,14,.72); color: #fff; text-align: center; padding: 20px; }
.game-overlay h2 { font-size: 22px; }
.game-overlay p { font-size: 13px; color: #c8cede; max-width: 360px; line-height: 1.5; }
.hidden { display: none !important; }
.msw-cell { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 3px; user-select: none; }

/* ============ MINESWEEPER ============ */
.msw-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: var(--panel-2); }
.msw-bar { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 14px; }
.msw-counter { background: #12141c; color: #ff6b6b; padding: 3px 10px; border-radius: 6px; letter-spacing: 2px; border: 1px solid var(--border-soft); }
.msw-face { font-size: 20px; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border-soft); background: var(--panel); cursor: pointer; }
.msw-grid { display: grid; gap: 2px; background: rgba(0,0,0,.35); padding: 4px; border-radius: 8px; }
.msw-cell.closed { background: linear-gradient(160deg, #5a6478, #3c4354); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.msw-cell.closed:hover { filter: brightness(1.2); }
.msw-cell.open { background: var(--panel); cursor: default; }
.msw-cell.flag { background: linear-gradient(160deg, #6b5a2e, #4a3f22); }
.msw-boom { background: var(--danger) !important; }

/* boot screen */
#boot { position: fixed; inset: 0; background: #05070d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 999999; transition: opacity .6s ease; color: #dfe6ff; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot svg { width: 84px; height: 84px; animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#boot .bname { font-size: 22px; font-weight: 700; letter-spacing: 4px; }
#boot .bbar { width: 220px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
#boot .bbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4f8cff, #8a5cff); transition: width .3s ease; }
#boot .bmsg { font-size: 11.5px; color: #7f8aa8; font-family: var(--mono); height: 14px; }
</style>
</head>
<body>
<div id="wallpaper"></div>
<div id="desktop">
  <div id="icon-layer"></div>
</div>
<div id="windows-layer"></div>

<div id="start-menu">
  <div id="start-search-wrap"><input id="start-search" type="text" placeholder="Search apps, games, commands…" autocomplete="off"></div>
  <div id="start-grid"></div>
</div>

<div id="dock">
  <button class="dock-item" id="start-btn" data-tip="Start"></button>
  <div class="dock-sep"></div>
  <div id="dock-apps" style="display:flex;gap:6px;align-items:center;"></div>
  <button id="clock"><span id="clock-time"></span><span id="clock-date"></span></button>
</div>

<div id="boot">
  <svg viewBox="0 0 100 100"><defs><linearGradient id="bpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient></defs><polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="url(#bpg)" stroke-width="5"/><circle cx="50" cy="50" r="14" fill="url(#bpg)"/></svg>
  <div class="bname">NEBULA OS</div>
  <div class="bbar"><i id="boot-fill"></i></div>
  <div class="bmsg" id="boot-msg"></div>
</div>
