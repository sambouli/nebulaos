<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NebulaOS — Browser Operating System</title><link rel="icon" href="data:,">
<style>
/* ============ THEME TOKENS ============ */
:root {
  --radius: 12px;
  --dock-h: 64px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
}
html[data-theme="dark"] {
  --bg-accent-a: #1b2a5e; --bg-accent-b: #0d1024; --bg-accent-c: #2b1055;
  --wall: radial-gradient(1200px 800px at 15% 10%, rgba(90,120,255,.35), transparent 60%),
          radial-gradient(1000px 700px at 85% 90%, rgba(180,60,220,.28), transparent 60%),
          linear-gradient(160deg, var(--bg-accent-a), var(--bg-accent-b) 55%, var(--bg-accent-c));
  --win-bg: rgba(28,30,38,.92);
  --win-border: rgba(255,255,255,.10);
  --titlebar: rgba(40,43,54,.95);
  --panel: #232631;
  --panel-2: #1b1e27;
  --text: #e8eaf0;
  --text-dim: #9aa1b2;
  --accent: #4f8cff;
  --accent-2: #8a5cff;
  --hover: rgba(255,255,255,.08);
  --active: rgba(79,140,255,.22);
  --shadow: 0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --dock-bg: rgba(22,24,32,.72);
  --menu-bg: rgba(24,26,34,.92);
  --input-bg: #15171f;
  --border-soft: rgba(255,255,255,.09);
  --danger: #ff5f57; --warn: #febc2e; --ok: #28c840;
}
html[data-theme="light"] {
  --bg-accent-a: #dbe7ff; --bg-accent-b: #f3f5fb; --bg-accent-c: #f0dcff;
  --wall: radial-gradient(1200px 800px at 15% 10%, rgba(80,130,255,.30), transparent 60%),
          radial-gradient(1000px 700px at 85% 90%, rgba(200,90,255,.22), transparent 60%),
          linear-gradient(160deg, var(--bg-accent-a), var(--bg-accent-b) 55%, var(--bg-accent-c));
  --win-bg: rgba(252,252,254,.96);
  --win-border: rgba(0,0,0,.12);
  --titlebar: rgba(238,240,246,.98);
  --panel: #ffffff;
  --panel-2: #eef0f5;
  --text: #1c2230;
  --text-dim: #5d6678;
  --accent: #2563eb;
  --accent-2: #7c3aed;
  --hover: rgba(0,0,0,.06);
  --active: rgba(37,99,235,.16);
  --shadow: 0 18px 44px rgba(30,40,80,.22), 0 2px 6px rgba(30,40,80,.12);
  --dock-bg: rgba(255,255,255,.65);
  --menu-bg: rgba(250,251,253,.94);
  --input-bg: #ffffff;
  --border-soft: rgba(0,0,0,.10);
  --danger: #e5484d; --warn: #d99100; --ok: #2fa84f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); color: var(--text); background: #000; user-select: none; -webkit-user-select: none; }
::selection { background: var(--accent); color: #fff; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(128,128,128,.45); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ WALLPAPER / DESKTOP ============ */
#wallpaper { position: fixed; inset: 0; background: var(--wall); transition: background .5s ease; }
#desktop { position: fixed; inset: 0 0 var(--dock-h) 0; }
#icon-layer { position: absolute; inset: 0; padding: 14px; }
.desk-icon { position: absolute; width: 92px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 5px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.desk-icon:hover { background: var(--hover); }
.desk-icon.selected { background: var(--active); border-color: var(--accent); }
.desk-icon.dragging { opacity: .55; }
.desk-icon .ic { width: 52px; height: 52px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); pointer-events: none; }
.desk-icon .lbl { font-size: 12px; text-align: center; line-height: 1.15; max-width: 90px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.85); word-break: break-word; pointer-events: none; }
html[data-theme="light"] .desk-icon .lbl { color: #16203a; text-shadow: 0 1px 2px rgba(255,255,255,.85); }

/* ============ WINDOWS ============ */
.window { position: absolute; min-width: 320px; min-height: 200px; background: var(--win-bg); border: 1px solid var(--win-border); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); transition: opacity .15s, transform .15s; }
.window.maximized { border-radius: 0; }
.window.minimized { opacity: 0; transform: scale(.6) translateY(120px); pointer-events: none; }
.window.closing { opacity: 0; transform: scale(.92); }
.titlebar { height: 38px; flex: 0 0 38px; background: var(--titlebar); display: flex; align-items: center; gap: 8px; padding: 0 10px; cursor: default; border-bottom: 1px solid var(--border-soft); }
.window:not(.focused) .titlebar { opacity: .75; }
.tb-title { font-size: 13px; font-weight: 600; margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-app-ic { width: 16px; height: 16px; flex: 0 0 16px; }
.win-btns { margin-left: auto; display: flex; gap: 8px; }
.win-btn { width: 13px; height: 13px; border-radius: 50%; border: none; cursor: pointer; padding: 0; position: relative; }
.win-btn svg { position: absolute; inset: 0; opacity: 0; }
.win-btns:hover .win-btn svg { opacity: .55; }
.btn-close { background: var(--danger); } .btn-min { background: var(--warn); } .btn-max { background: var(--ok); }
.win-body { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--win-bg); }
.resizer { position: absolute; z-index: 5; }
.rz-e { right: 0; top: 10px; bottom: 10px; width: 6px; cursor: ew-resize; }
.rz-s { bottom: 0; left: 10px; right: 10px; height: 6px; cursor: ns-resize; }
.rz-se { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.rz-w { left: 0; top: 10px; bottom: 10px; width: 6px; cursor: ew-resize; }

/* ============ DOCK / TASKBAR ============ */
#dock { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); height: calc(var(--dock-h) - 8px); display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--dock-bg); border: 1px solid var(--border-soft); border-radius: 18px; box-shadow: var(--shadow); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); z-index: 90000; max-width: 96vw; }
.dock-item { position: relative; width: 46px; height: 46px; border: none; background: transparent; cursor: pointer; padding: 2px; border-radius: 12px; transition: transform .12s ease; }
.dock-item:hover { transform: translateY(-7px) scale(1.12); background: var(--hover); }
.dock-item svg { width: 100%; height: 100%; }
.dock-item .dot { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); opacity: 0; }
.dock-item.running .dot { opacity: 1; }
.dock-item.focused .dot { opacity: 1; background: var(--accent); width: 16px; border-radius: 3px; }
.dock-sep { width: 1px; height: 34px; background: var(--border-soft); margin: 0 4px; }
#clock { margin-left: 8px; text-align: right; padding: 0 10px; cursor: pointer; border-radius: 10px; line-height: 1.2; border: none; background: transparent; color: var(--text); font-family: var(--font); }
#clock:hover { background: var(--hover); }
#clock-time { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; display: block; }
#clock-date { font-size: 10.5px; color: var(--text-dim); display: block; }
#start-btn.active { background: var(--active); }

.dock-item[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: var(--menu-bg); color: var(--text); border: 1px solid var(--border-soft); padding: 4px 10px; border-radius: 8px; font-size: 12px; white-space: nowrap; backdrop-filter: blur(10px); pointer-events: none; box-shadow: var(--shadow); z-index: 2; }

/* ============ START MENU ============ */
#start-menu { position: fixed; left: 50%; bottom: calc(var(--dock-h) + 10px); transform: translateX(-50%) translateY(14px); width: 540px; max-width: 94vw; max-height: 62vh; background: var(--menu-bg); border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 89999; display: flex; flex-direction: column; overflow: hidden; }
#start-menu.open { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
#start-search-wrap { padding: 14px 16px 8px; }
#start-search { width: 100%; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border-soft); background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; font-family: var(--font); }
#start-search:focus { border-color: var(--accent); }
#start-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px 12px 14px; overflow-y: auto; }
.start-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 12px; cursor: pointer; border: none; background: transparent; color: var(--text); }
.start-tile:hover { background: var(--hover); }
.start-tile svg { width: 40px; height: 40px; }
.start-tile span { font-size: 11.5px; text-align: center; }
.start-cat { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-dim); padding: 10px 8px 2px; }

/* ============ CONTEXT MENU ============ */
.ctx-menu { position: fixed; min-width: 216px; background: var(--menu-bg); border: 1px solid var(--border-soft); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); padding: 6px; z-index: 95000; animation: ctxin .12s ease; }
@keyframes ctxin { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.ctx-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: none; background: transparent; color: var(--text); font-size: 13px; border-radius: 8px; cursor: pointer; text-align: left; font-family: var(--font); }
.ctx-item:hover { background: var(--accent); color: #fff; }
.ctx-item .sub { margin-left: auto; color: var(--text-dim); font-size: 11px; }
.ctx-item:hover .sub { color: rgba(255,255,255,.8); }
.ctx-sep { height: 1px; background: var(--border-soft); margin: 5px 8px; }
.swatch-row { display: flex; gap: 6px; padding: 4px 12px 8px; }
.swatch { width: 36px; height: 24px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
.swatch.active { border-color: var(--accent); }
.ctx-label { font-size: 11px; color: var(--text-dim); padding: 6px 12px 4px; text-transform: uppercase; letter-spacing: .6px; }

/* ============ SHARED APP UI ============ */
.app-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel-2); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
.btn { padding: 6px 13px; border-radius: 8px; border: 1px solid var(--border-soft); background: var(--panel); color: var(--text); font-size: 12.5px; cursor: pointer; font-family: var(--font); transition: background .12s, transform .06s; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.12); background: var(--accent); }
.btn.danger { color: var(--danger); }
.text-input { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border-soft); background: var(--input-bg); color: var(--text); font-size: 13px; outline: none; font-family: var(--font); }
.text-input:focus { border-color: var(--accent); }
.status-bar { flex: 0 0 auto; padding: 5px 12px; font-size: 11.5px; color: var(--text-dim); background: var(--panel-2); border-top: 1px solid var(--border-soft); display: flex; gap: 16px; }
.scroll-area { flex: 1; overflow-y: auto; }

/* ============ FILE BROWSER ============ */
.fb-side { flex: 0 0 160px; border-right: 1px solid var(--border-soft); background: var(--panel-2); padding: 8px; overflow-y: auto; }
.fb-side-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--text-dim); }
.fb-side-item:hover { background: var(--hover); color: var(--text); }
.fb-side-item.active { background: var(--active); color: var(--text); }
.fb-side-item svg { width: 16px; height: 16px; flex: 0 0 16px; }
.fb-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.fb-crumbs { display: flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 2px 4px; flex-wrap: wrap; }
.crumb { padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--text-dim); }
.crumb:hover { background: var(--hover); color: var(--text); }
.crumb.cur { color: var(--text); font-weight: 600; }
.fb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; padding: 12px; align-content: start; flex: 1; overflow-y: auto; }
.fb-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.fb-item:hover { background: var(--hover); }
.fb-item.sel { background: var(--active); border-color: var(--accent); }
.fb-item svg { width: 42px; height: 42px; }
.fb-item span { font-size: 11.5px; text-align: center; word-break: break-word; line-height: 1.2; }
.fb-preview { flex: 0 0 38%; border-top: 1px solid var(--border-soft); background: var(--panel-2); padding: 12px 16px; overflow-y: auto; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--text-dim); user-select: text; -webkit-user-select: text; }
.fb-preview .pv-title { font-family: var(--font); font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 8px; }

/* ============ NOTES ============ */
.notes-list { flex: 0 0 190px; border-right: 1px solid var(--border-soft); background: var(--panel-2); overflow-y: auto; padding: 8px; }
.note-card { padding: 9px 11px; border-radius: 9px; cursor: pointer; margin-bottom: 5px; border: 1px solid transparent; }
.note-card:hover { background: var(--hover); }
.note-card.sel { background: var(--active); border-color: var(--accent); }
.note-card b { display: block; font-size: 12.5px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-card small { font-size: 10.5px; color: var(--text-dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notes-editor { flex: 1; display: flex; flex-direction: column; }
.notes-editor textarea { flex: 1; width: 100%; border: none; outline: none; resize: none; background: var(--win-bg); color: var(--text); padding: 16px 20px; font-family: var(--mono); font-size: 13.5px; line-height: 1.6; user-select: text; -webkit-user-select: text; }

/* ============ MAIL ============ */
.mail-list { flex: 0 0 280px; border-right: 1px solid var(--border-soft); overflow-y: auto; background: var(--panel-2); }
.mail-row { padding: 11px 14px; border-bottom: 1px solid var(--border-soft); cursor: pointer; }
.mail-row:hover { background: var(--hover); }
.mail-row.sel { background: var(--active); }
.mail-row .from { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.mail-row .from .t { font-weight: 400; font-size: 10.5px; color: var(--text-dim); flex: 0 0 auto; }
.mail-row .subj { font-size: 12.5px; margin: 2px 0; }
.mail-row .prev { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mail-row.unread .subj, .mail-row.unread .from { color: var(--accent); }
.mail-row.unread .subj::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
.mail-read { flex: 1; overflow-y: auto; padding: 22px 26px; }
.mail-read h2 { font-size: 18px; margin-bottom: 6px; }
.mail-read .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border-soft); }
.mail-read .body-txt { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
.mail-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 13px; flex-direction: column; gap: 10px; }
.modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .15s; }
.modal.show { opacity: 1; pointer-events: auto; }
.modal-card { width: min(440px, 90%); background: var(--panel); border: 1px solid var(--border-soft); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.modal-card h3 { font-size: 15px; }

/* ============ CALENDAR ============ */
.cal-wrap { flex: 1; display: flex; flex-direction: column; padding: 14px; gap: 8px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head h2 { font-size: 17px; }
.cal-grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; padding: 4px 0; }
.cal-cell { border: 1px solid var(--border-soft); border-radius: 8px; padding: 5px 7px; font-size: 12.5px; cursor: pointer; position: relative; background: var(--panel); overflow: hidden; }
.cal-cell:hover { border-color: var(--accent); }
.cal-cell.other { opacity: .35; }
.cal-cell.today { background: var(--accent); color: #fff; font-weight: 700; border-color: var(--accent); }
.cal-cell.sel { outline: 2px solid var(--accent-2); }
.cal-cell .evt-dot { position: absolute; bottom: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.cal-day-panel { flex: 0 0 auto; border-top: 1px solid var(--border-soft); padding: 10px 14px; min-height: 74px; }
.cal-day-panel h4 { font-size: 12.5px; margin-bottom: 6px; }
.cal-ev { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; }
.cal-ev:hover { background: var(--hover); }
.cal-ev button { margin-left: auto; border: none; background: none; color: var(--danger); cursor: pointer; font-size: 12px; }

/* ============ TERMINAL / ASSISTANT ============ */
.term { flex: 1; overflow-y: auto; padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--panel-2); user-select: text; -webkit-user-select: text; }
.term-line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
.term-line.sys { color: var(--text-dim); }
.term-line.err { color: var(--danger); }
.term-line.ok { color: var(--ok); }
.term-line.hdr { color: var(--accent); font-weight: 700; }
.term-line.acc { color: var(--accent-2); }
.term-input-row { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border-soft); background: var(--panel-2); }
.term-prompt { font-family: var(--mono); color: var(--ok); font-size: 13px; }
.term-input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-family: var(--mono); font-size: 13px; }
.term-input-row input::placeholder { color: var(--text-dim); }

/* ============ CALCULATOR (special feature) ============ */
.calc { flex: 1; display: flex; flex-direction: column; background: var(--panel-2); }
.calc-screen { padding: 18px 18px 8px; text-align: right; }
.calc-expr { font-size: 13px; color: var(--text-dim); min-height: 18px; font-family: var(--mono); word-break: break-all; }
.calc-acc { font-size: 34px; font-weight: 300; font-variant-numeric: tabular-nums; word-break: break-all; min-height: 44px; }
.calc-history { flex: 0 0 92px; overflow-y: auto; border-top: 1px solid var(--border-soft); padding: 6px 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.calc-history div { padding: 2px 0; cursor: pointer; }
.calc-history div:hover { color: var(--text); }
.calc-keys { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 10px; }
.calc-key { border: 1px solid var(--border-soft); border-radius: 10px; background: var(--panel); color: var(--text); font-size: 16px; cursor: pointer; transition: filter .1s, transform .05s; font-family: var(--font); }
.calc-key:hover { background: var(--hover); }
.calc-key:active { transform: scale(.94); }
.calc-key.op { color: var(--accent); font-weight: 600; }
.calc-key.fn { color: var(--accent-2); font-size: 13px; }
.calc-key.eq { background: var(--accent); color: #fff; border-color: var(--accent); }
.calc-key.mem { color: var(--warn); font-size: 12.5px; }

/* ============ ABOUT ============ */
.about { flex: 1; overflow-y: auto; padding: 26px 30px; }
.about h1 { font-size: 26px; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.about h1 svg { width: 40px; height: 40px; }
.about .ver { color: var(--text-dim); font-size: 12.5px; margin-bottom: 20px; }
.about h3 { margin: 18px 0 8px; font-size: 14px; color: var(--accent); }
.about p, .about li { font-size: 13px; line-height: 1.65; color: var(--text); user-select: text; -webkit-user-select: text; }
.about ul { padding-left: 22px; }
.about kbd { font-family: var(--mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--border-soft); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
.about .card { background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 18px; margin: 10px 0; }

/* game frame */
.game-frame { flex: 1; display: flex; align-items: center; justify-content: center; background: #10121a; position: relative; overflow: hidden; }
.game-frame canvas { display: block; }
.game-hud { position: absolute; top: 8px; left: 12px; font-family: var(--mono); font-size: 12px; color: #9fe8a8; text-shadow: 0 1px 2px #000; pointer-events: none; }
.game-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(6,8,14,.72); color: #fff; text-align: center; padding: 20px; }
.game-overlay h2 { font-size: 22px; }
.game-overlay p { font-size: 13px; color: #c8cede; max-width: 360px; line-height: 1.5; }
.hidden { display: none !important; }
.msw-cell { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 700; font-size: 13px; cursor: pointer; border-radius: 3px; user-select: none; }

/* ============ MINESWEEPER ============ */
.msw-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; background: var(--panel-2); }
.msw-bar { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 14px; }
.msw-counter { background: #12141c; color: #ff6b6b; padding: 3px 10px; border-radius: 6px; letter-spacing: 2px; border: 1px solid var(--border-soft); }
.msw-face { font-size: 20px; width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--border-soft); background: var(--panel); cursor: pointer; }
.msw-grid { display: grid; gap: 2px; background: rgba(0,0,0,.35); padding: 4px; border-radius: 8px; }
.msw-cell.closed { background: linear-gradient(160deg, #5a6478, #3c4354); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }
.msw-cell.closed:hover { filter: brightness(1.2); }
.msw-cell.open { background: var(--panel); cursor: default; }
.msw-cell.flag { background: linear-gradient(160deg, #6b5a2e, #4a3f22); }
.msw-boom { background: var(--danger) !important; }

/* boot screen */
#boot { position: fixed; inset: 0; background: #05070d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 999999; transition: opacity .6s ease; color: #dfe6ff; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot svg { width: 84px; height: 84px; animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#boot .bname { font-size: 22px; font-weight: 700; letter-spacing: 4px; }
#boot .bbar { width: 220px; height: 4px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
#boot .bbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4f8cff, #8a5cff); transition: width .3s ease; }
#boot .bmsg { font-size: 11.5px; color: #7f8aa8; font-family: var(--mono); height: 14px; }
</style>

OS.windows = [];

function byId(id) { for (var i = 0; i < OS.windows.length; i++) if (OS.windows[i].id === id) return OS.windows[i]; return null; }

function focusWindow(w) {
  OS.windows.forEach(function (o) { o.el.classList.toggle('focused', o === w); });
  OS.zTop += 1;
  w.el.style.zIndex = OS.zTop;
  OS.focused = w;
  updateDock();
}

function createWindow(opts) {
  var id = 'win' + (OS.winSeq = (OS.winSeq || 0) + 1);
  var layer = $('#windows-layer');
  var frameW = D.documentElement.clientWidth, frameH = D.documentElement.clientHeight - 64;
  var w = opts.width || 720, h = opts.height || 480;
  w = Math.min(w, frameW - 20); h = Math.min(h, frameH - 20);
  var x = opts.x !== undefined ? opts.x : Math.max(10, (frameW - w) / 2 + (OS.winSeq % 5) * 26 - 52);
  var y = opts.y !== undefined ? opts.y : Math.max(10, (frameH - h) / 2 + (OS.winSeq % 5) * 22 - 44);

  var win = el('div', 'window');
  win.id = id;
  win.style.left = x + 'px'; win.style.top = y + 'px';
  win.style.width = w + 'px'; win.style.height = h + 'px';

  var tb = el('div', 'titlebar');
  tb.innerHTML = '<span class="tb-app-ic">' + iconSVG(opts.icon || 'file') + '</span><span class="tb-title">' + esc(opts.title) + '</span>' +
    '<div class="win-btns">' +
    '<button class="win-btn btn-min" title="Minimize"><svg viewBox="0 0 12 12"><line x1="2.5" y1="6" x2="9.5" y2="6" stroke="#5a4500" stroke-width="1.8" stroke-linecap="round"/></svg></button>' +
    '<button class="win-btn btn-max" title="Maximize"><svg viewBox="0 0 12 12"><path d="M3 8 L8 3 M8 3 H4.6 M8 3 V6.4" stroke="#0a4d1e" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>' +
    '<button class="win-btn btn-close" title="Close"><svg viewBox="0 0 12 12"><path d="M3 3 l6 6 M9 3 l-6 6" stroke="#5c1010" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>';

  var body = el('div', 'win-body');
  win.appendChild(tb); win.appendChild(body);
  ['w', 'e', 's', 'se'].forEach(function (dir) {
    var r = el('div', 'resizer rz-' + dir); r.setAttribute('data-rz', dir); win.appendChild(r);
  });
  layer.appendChild(win);

  var W_ = {
    id: id, el: win, body: body, titlebar: tb, appId: opts.appId || null,
    title: opts.title, minimized: false, maximized: false, restore: null,
    onClose: opts.onClose || null, single: opts.single || null
  };
  OS.windows.push(W_);

  /* window control buttons */
  $('.btn-close', tb).addEventListener('click', function (ev) { ev.stopPropagation(); closeWindow(W_); });
  $('.btn-min', tb).addEventListener('click', function (ev) { ev.stopPropagation(); minimizeWindow(W_); });
  $('.btn-max', tb).addEventListener('click', function (ev) { ev.stopPropagation(); toggleMaximize(W_); });
  tb.addEventListener('dblclick', function (ev) { if (!ev.target.closest('.win-btn')) toggleMaximize(W_); });

  /* bring to front on any interaction with the window */
  win.addEventListener('pointerdown', function () { if (OS.focused !== W_) focusWindow(W_); }, true);

  /* dragging via titlebar (pointer capture keeps it smooth off-window) */
  tb.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0 || ev.target.closest('.win-btn')) return;
    if (W_.maximized) return;
    var sx = ev.clientX, sy = ev.clientY;
    var ox = parseFloat(win.style.left), oy = parseFloat(win.style.top);
    var moved = false;
    tb.setPointerCapture(ev.pointerId);
    function mv(e) {
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      var nx = clamp(ox + dx, -win.offsetWidth + 90, D.documentElement.clientWidth - 60);
      var ny = clamp(oy + dy, 0, D.documentElement.clientHeight - 64 - 34);
      win.style.left = nx + 'px'; win.style.top = ny + 'px';
    }
    function up(e) {
      tb.removeEventListener('pointermove', mv); tb.removeEventListener('pointerup', up);
      try { tb.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    tb.addEventListener('pointermove', mv); tb.addEventListener('pointerup', up);
  });

  /* resizing from edges/corners */
  $$('.resizer', win).forEach(function (r) {
    r.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0 || W_.maximized) return;
      ev.preventDefault(); ev.stopPropagation();
      var dir = r.getAttribute('data-rz');
      var sx = ev.clientX, sy = ev.clientY;
      var ox = win.offsetLeft, oy = win.offsetTop, ow = win.offsetWidth, oh = win.offsetHeight;
      r.setPointerCapture(ev.pointerId);
      function mv(e) {
        var dx = e.clientX - sx, dy = e.clientY - sy;
        if (dir.indexOf('e') >= 0 || dir === 'se') win.style.width = Math.max(320, ow + dx) + 'px';
        if (dir === 'w') { var nw = Math.max(320, ow - dx); win.style.width = nw + 'px'; win.style.left = (ox + ow - nw) + 'px'; }
        if (dir === 's' || dir === 'se') win.style.height = Math.max(200, oh + dy) + 'px';
      }
      function up(e) {
        r.removeEventListener('pointermove', mv); r.removeEventListener('pointerup', up);
        try { r.releasePointerCapture(e.pointerId); } catch (err) {}
        OS.emit('winresize', W_);
      }
      r.addEventListener('pointermove', mv); r.addEventListener('pointerup', up);
    });
  });

  focusWindow(W_);
  updateDock();
  if (opts.onMount) opts.onMount(body, W_);
  return W_;
}

function closeWindow(w) {
  w.el.classList.add('closing');
  setTimeout(function () {
    if (w.el.parentNode) w.el.parentNode.removeChild(w.el);
    OS.windows = OS.windows.filter(function (o) { return o !== w; });
    try { if (w.onClose) w.onClose(); } catch (e) { console.error(e); }
    OS.emit('winclose', w);
    updateDock();
  }, 140);
}

function minimizeWindow(w) {
  w.minimized = true;
  w.el.classList.add('minimized');
  OS.focused = null;
  updateDock();
}
function unminimize(w) {
  w.minimized = false;
  w.el.classList.remove('minimized');
  focusWindow(w);
}
function toggleMaximize(w) {
  if (!w.maximized) {
    w.restore = { x: w.el.style.left, y: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
    w.el.style.left = '0px'; w.el.style.top = '0px';
    w.el.style.width = D.documentElement.clientWidth + 'px';
    w.el.style.height = (D.documentElement.clientHeight - 64) + 'px';
    w.maximized = true; w.el.classList.add('maximized');
  } else {
    w.el.style.left = w.restore.x; w.el.style.top = w.restore.y;
    w.el.style.width = w.restore.width; w.el.style.height = w.restore.height;
    w.maximized = false; w.el.classList.remove('maximized');
  }
  OS.emit('winresize', w);
}

/* keep maximized windows fitted on browser resize */
W.addEventListener('resize', function () {
  OS.windows.forEach(function (w) {
    if (w.maximized) {
      w.el.style.width = D.documentElement.clientWidth + 'px';
      w.el.style.height = (D.documentElement.clientHeight - 64) + 'px';
    }
  });
});

var DESKTOP_ORDER = ['files', 'notes', 'mail', 'calendar', 'terminal', 'calc', 'gta', 'tetris', 'snake', 'flappy', 'mines', 'readme'];

function launchApp(id) {
  var app = APPS[id];
  if (!app) return;
  closeStartMenu();
  app.launch();
}

/* ---------- desktop icons ---------- */
var GRID = { cellW: 100, cellH: 96, padX: 14, padY: 14 };
function gridPos(col, row) { return { x: GRID.padX + col * GRID.cellW, y: GRID.padY + row * GRID.cellH }; }
function gridFromPos(x, y) { return { col: Math.max(0, Math.round((x - GRID.padX) / GRID.cellW)), row: Math.max(0, Math.round((y - GRID.padY) / GRID.cellH)) }; }

function renderDesktop() {
  var layer = $('#icon-layer');
  layer.innerHTML = '';
  var maxRows = Math.max(3, Math.floor((D.documentElement.clientHeight - 100) / GRID.cellH));
  DESKTOP_ORDER.forEach(function (id, idx) {
    var app = APPS[id];
    if (!app) return;
    var pos = OS.settings.iconPos[id];
    if (!pos) pos = gridPos(Math.floor(idx / maxRows), idx % maxRows);
    var ic = el('div', 'desk-icon');
    ic.setAttribute('data-app', id);
    ic.style.left = pos.x + 'px'; ic.style.top = pos.y + 'px';
    ic.innerHTML = '<span class="ic">' + iconSVG(app.icon) + '</span><span class="lbl">' + esc(app.name) + '</span>';
    layer.appendChild(ic);

    var down = null;
    ic.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      $$('.desk-icon.selected').forEach(function (s) { s.classList.remove('selected'); });
      ic.classList.add('selected');
      down = { x: ev.clientX, y: ev.clientY, ox: parseFloat(ic.style.left), oy: parseFloat(ic.style.top), moved: false };
      ic.setPointerCapture(ev.pointerId);
    });
    ic.addEventListener('pointermove', function (ev) {
      if (!down) return;
      var dx = ev.clientX - down.x, dy = ev.clientY - down.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) down.moved = true;
      if (down.moved) {
        ic.classList.add('dragging');
        ic.style.left = clamp(down.ox + dx, 0, D.documentElement.clientWidth - 100) + 'px';
        ic.style.top = clamp(down.oy + dy, 0, D.documentElement.clientHeight - 64 - 92) + 'px';
      }
    });
    ic.addEventListener('pointerup', function (ev) {
      if (!down) return;
      var wasMoved = down.moved; down = null;
      try { ic.releasePointerCapture(ev.pointerId); } catch (e) {}
      ic.classList.remove('dragging');
      if (wasMoved) {
        var g = gridFromPos(parseFloat(ic.style.left), parseFloat(ic.style.top));
        var p = gridPos(g.col, g.row);
        /* avoid stacking on an occupied cell */
        var taken = {};
        $$('.desk-icon').forEach(function (o) {
          if (o !== ic) taken[Math.round(parseFloat(o.style.left) / GRID.cellW) + ',' + Math.round(parseFloat(o.style.top) / GRID.cellH)] = 1;
        });
        var guard = 0;
        while (taken[g.col + ',' + g.row] && guard++ < 60) g.row++;
        p = gridPos(g.col, g.row);
        ic.style.left = p.x + 'px'; ic.style.top = p.y + 'px';
        OS.settings.iconPos[id] = p; saveSettings();
      } else {
        launchApp(id);
      }
    });
    ic.addEventListener('contextmenu', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      showContextMenu(ev.clientX, ev.clientY, [
        { label: 'Open', icon: null, fn: function () { launchApp(id); } },
        { sep: true },
        { label: 'Reset icon position', fn: function () { delete OS.settings.iconPos[id]; saveSettings(); renderDesktop(); } }
      ]);
    });
  });
}

function resetIconPositions() { OS.settings.iconPos = {}; saveSettings(); renderDesktop(); }

/* ============================================================
   Part 05: Dock, start menu, clock, context menus.
   ============================================================ */
var DOCK_APPS = ['files', 'notes', 'mail', 'calendar', 'terminal', 'calc', 'gta', 'tetris', 'snake', 'flappy', 'mines'];

function buildDock() {
  $('#start-btn').innerHTML = iconSVG('start');
  var host = $('#dock-apps');
  host.innerHTML = '';
  DOCK_APPS.forEach(function (id) {
    var app = APPS[id];
    var b = el('button', 'dock-item');
    b.setAttribute('data-app', id);
    b.setAttribute('data-tip', app.name);
    b.innerHTML = iconSVG(app.icon) + '<span class="dot"></span>';
    b.addEventListener('click', function () { dockClick(id); });
    b.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      showContextMenu(ev.clientX, ev.clientY - 60, [
        { label: 'Open ' + app.name, fn: function () { launchApp(id); } },
        { label: 'Close all windows', fn: function () { OS.windows.filter(function (w) { return w.appId === id; }).forEach(closeWindow); } }
      ]);
    });
    host.appendChild(b);
  });
  updateDock();
}

function dockClick(id) {
  var wins = OS.windows.filter(function (w) { return w.appId === id; });
  if (!wins.length) { launchApp(id); return; }
  var visible = wins.filter(function (w) { return !w.minimized && OS.focused !== w; });
  if (visible.length) { minimizeWindow(wins.find(function (w) { return !w.minimized; }) || wins[0]); }
  else {
    var min = wins.filter(function (w) { return w.minimized; });
    if (min.length) unminimize(min[0]); else focusWindow(wins[wins.length - 1]);
  }
}

function updateDock() {
  $$('#dock-apps .dock-item').forEach(function (b) {
    var id = b.getAttribute('data-app');
    var wins = OS.windows.filter(function (w) { return w.appId === id; });
    b.classList.toggle('running', wins.length > 0);
    b.classList.toggle('focused', !!OS.focused && OS.focused.appId === id && !OS.focused.minimized);
  });
}

/* ---------- start menu ---------- */
function buildStartMenu(filter) {
  var grid = $('#start-grid');
  grid.innerHTML = '';
  var cats = ['System', 'Games', 'Docs'];
  var q = (filter || '').toLowerCase().trim();
  var anyShown = false;
  cats.forEach(function (cat) {
    var apps = Object.keys(APPS).map(function (k) { return APPS[k]; })
      .filter(function (a) { return a.cat === cat && (!q || a.name.toLowerCase().indexOf(q) >= 0); });
    if (!apps.length) return;
    anyShown = true;
    grid.appendChild(el('div', 'start-cat', esc(cat)));
    apps.forEach(function (a) {
      var t = el('button', 'start-tile');
      t.innerHTML = iconSVG(a.icon) + '<span>' + esc(a.name) + '</span>';
      t.addEventListener('click', function () { launchApp(a.id); });
      grid.appendChild(t);
    });
  });
  if (!anyShown) {
    grid.appendChild(el('div', 'start-cat', 'No results'));
    var hint = el('div');
    hint.style.cssText = 'grid-column:1/-1;padding:4px 12px 12px;font-size:12px;color:var(--text-dim)';
    hint.textContent = 'Nothing matches "' + filter + '". Try the Assistant for commands like /help or /time.';
    grid.appendChild(hint);
  }
}

function openStartMenu() {
  buildStartMenu('');
  $('#start-menu').classList.add('open');
  $('#start-btn').classList.add('active');
  var s = $('#start-search'); s.value = ''; setTimeout(function () { s.focus(); }, 60);
}
function closeStartMenu() {
  $('#start-menu').classList.remove('open');
  $('#start-btn').classList.remove('active');
}
function toggleStartMenu() {
  if ($('#start-menu').classList.contains('open')) closeStartMenu(); else openStartMenu();
}

var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function tickClock() {
  var n = new Date();
  $('#clock-time').textContent = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds());
  $('#clock-date').textContent = DAYS[n.getDay()].slice(0, 3) + ', ' + MONTHS[n.getMonth()].slice(0, 3) + ' ' + n.getDate();
}

/* ---------- generic context menu ---------- */
function dismissMenus() {
  $$('.ctx-menu').forEach(function (m) { m.parentNode.removeChild(m); });
}
function showContextMenu(x, y, items) {
  dismissMenus();
  var m = el('div', 'ctx-menu');
  items.forEach(function (it) {
    if (it.sep) { m.appendChild(el('div', 'ctx-sep')); return; }
    if (it.labelOnly) { m.appendChild(el('div', 'ctx-label', esc(it.labelOnly))); return; }
    if (it.swatches) {
      var row = el('div', 'swatch-row');
      it.swatches.forEach(function (sw) {
        var s = el('div', 'swatch');
        s.style.background = sw.preview;
        s.title = sw.label;
        if (OS.settings.wallpaper === sw.key) s.classList.add('active');
        s.addEventListener('click', function () { applyWallpaper(sw.key); dismissMenus(); });
        row.appendChild(s);
      });
      m.appendChild(row);
      return;
    }
    var b = el('button', 'ctx-item');
    b.innerHTML = esc(it.label) + (it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : '');
    b.addEventListener('click', function () { dismissMenus(); it.fn(); });
    m.appendChild(b);
  });
  D.body.appendChild(m);
  var r = m.getBoundingClientRect();
  if (x + r.width > D.documentElement.clientWidth - 6) x = D.documentElement.clientWidth - r.width - 6;
  if (y + r.height > D.documentElement.clientHeight - 6) y = D.documentElement.clientHeight - r.height - 6;
  m.style.left = x + 'px'; m.style.top = y + 'px';
}

function desktopContextMenu(x, y) {
  var wpSw = Object.keys(WALLPAPERS).map(function (k) { return { key: k, label: WALLPAPERS[k].label, preview: WALLPAPERS[k].preview }; });
  showContextMenu(x, y, [
    { label: 'Refresh desktop', fn: function () { refreshDesktopFx(); } },
    { label: 'Reset icon layout', fn: resetIconPositions },
    { sep: true },
    { labelOnly: 'Wallpaper' },
    { swatches: wpSw },
    { sep: true },
    { label: OS.settings.theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode', sub: 'Theme', fn: toggleTheme },
    { label: 'Open Assistant', sub: '/help', fn: function () { launchTerminalWith('/help'); } },
    { sep: true },
    { label: 'About NebulaOS', fn: launchAbout }
  ]);
}

function refreshDesktopFx() {
  var layer = $('#icon-layer');
  layer.style.transition = 'opacity .18s';
  layer.style.opacity = '0';
  setTimeout(function () {
    renderDesktop();
    layer.style.opacity = '1';
    toast('Desktop refreshed');
  }, 200);
}

/* lightweight toast */
function toast(msg) {
  var t = el('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--menu-bg);color:var(--text);border:1px solid var(--border-soft);padding:9px 18px;border-radius:12px;font-size:13px;z-index:96000;box-shadow:var(--shadow);backdrop-filter:blur(14px);transition:opacity .3s,transform .3s;opacity:0;pointer-events:none';
  D.body.appendChild(t);

  setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 350); }, 2200);
}

var FS = Store.get('fs', null) || defaultFS();
function saveFS() { Store.set('fs', FS); }

function fileKindIcon(path) {
  var f = FS[path];
  if (!f) return ICONS.file();
  if (f.type === 'dir') return ICONS.folder();
  var k = f.kind || 'txt';
  if (ICONS[k] && k !== 'txt') return ICONS[k]();
  return ICONS.file();
}
function fakeSize(path) {
  var f = FS[path];
  if (!f) return '';
  if (f.type === 'dir') return f.children.length + ' items';
  return Math.max(1, Math.round(f.content.length / 64)) + ' KB';
}

function launchFilesWithPath(startPath) {
  var existing = OS.windows.filter(function (w) { return w.appId === 'files'; })[0];
  if (existing) { focusWindow(existing); if (startPath && existing.fbNav) existing.fbNav(startPath); return existing; }
  var win = createWindow({ appId: 'files', title: 'Files', icon: 'files', width: 780, height: 520, onMount: function (body, W_) { mountFiles(body, W_, startPath || '/Home'); } });
  return win;
}
function launchFiles() { launchFilesWithPath(); }

function mountFiles(body, win, startPath) {
  var cwd = startPath;
  var selected = null;

  body.innerHTML =
    '<div style="display:flex;flex:1;overflow:hidden">' +
      '<div class="fb-side"></div>' +
      '<div class="fb-main">' +
        '<div class="app-toolbar">' +
          '<button class="btn fb-back">&larr;</button>' +
          '<button class="btn fb-up">&uarr;</button>' +
          '<div class="fb-crumbs"></div>' +
          '<div style="margin-left:auto;display:flex;gap:8px">' +
            '<input class="text-input fb-newname" placeholder="New folder name" style="width:150px">' +
            '<button class="btn primary fb-mkdir">+ New Folder</button>' +
          '</div>' +
        '</div>' +
        '<div class="fb-grid"></div>' +
        '<div class="fb-preview hidden"></div>' +
      '</div>' +
    '</div>';

  var side = $('.fb-side', body), crumbs = $('.fb-crumbs', body), grid = $('.fb-grid', body), prev = $('.fb-preview', body);
  var stack = [cwd];

  /* sidebar quick links */
  [['/Home', 'Home', 'files'], ['/Home/Desktop', 'Desktop', 'files'], ['/Home/Documents', 'Documents', 'files'], ['/Home/Pictures', 'Pictures', 'img'], ['/Home/Music', 'Music', 'music'], ['/System', 'System', 'terminal']].forEach(function (q) {
    var s = el('div', 'fb-side-item');
    s.innerHTML = iconSVG(q[2]) + '<span>' + esc(q[1]) + '</span>';
    s.addEventListener('click', function () { nav(q[0]); });
    s.setAttribute('data-path', q[0]);
    side.appendChild(s);
  });

  function parentOf(p) {
    if (p === '/') return null;
    var i = p.lastIndexOf('/');
    return i <= 0 ? '/' : p.slice(0, i);
  }
  function join(p, name) { return (p === '/' ? '' : p) + '/' + name; }

  function nav(p) {
    if (!FS[p] || FS[p].type !== 'dir') return;
    cwd = p; selected = null;
    stack.push(p);
    render();
  }
  win.fbNav = nav;

  function render() {
    $$('.fb-side-item', side).forEach(function (s) { s.classList.toggle('active', s.getAttribute('data-path') === cwd); });
    /* breadcrumbs */
    crumbs.innerHTML = '';
    var parts = cwd === '/' ? [''] : cwd.split('/');
    var acc = '';
    parts.forEach(function (part, i) {
      acc = i === 0 ? '/' : acc + '/' + part;
      var pathAt = acc;
      var c = el('span', 'crumb' + (i === parts.length - 1 ? ' cur' : ''), esc(i === 0 ? 'This PC' : part));
      c.addEventListener('click', function () { nav(pathAt); });
      crumbs.appendChild(c);
      if (i < parts.length - 1) crumbs.appendChild(el('span', null, '<span style="color:var(--text-dim)">/</span>'));
    });
    /* grid */
    grid.innerHTML = '';
    var dir = FS[cwd];
    dir.children.slice().sort(function (a, b) {
      var fa = FS[join(cwd, a)], fb = FS[join(cwd, b)];
      var da = fa && fa.type === 'dir', db = fb && fb.type === 'dir';
      if (da !== db) return da ? -1 : 1;
      return a.localeCompare(b);
    }).forEach(function (name) {
      var path = join(cwd, name);
      var item = el('div', 'fb-item');
      item.innerHTML = fileKindIcon(path) + '<span>' + esc(name) + '</span>';
      item.addEventListener('click', function () {
        $$('.fb-item.sel', grid).forEach(function (x) { x.classList.remove('sel'); });
        item.classList.add('sel');
        selected = path;
        showPreview(path);
      });
      item.addEventListener('dblclick', function () {
        var f = FS[path];
        if (f && f.type === 'dir') nav(path);
      });
      item.addEventListener('contextmenu', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        var f = FS[path];
        var items = [{ label: 'Open', fn: function () { if (f.type === 'dir') nav(path); else { selected = path; showPreview(path); } } }];
        if (f.type === 'dir') items.push({ label: 'Delete folder', fn: function () { deleteRecursive(path); saveFS(); render(); toast('Deleted ' + name); } });
        showContextMenu(ev.clientX, ev.clientY, items);
      });
      grid.appendChild(item);
    });
    if (!dir.children.length) grid.appendChild(el('div', null, '<span style="color:var(--text-dim);font-size:12.5px;padding:8px">Empty folder — use “New Folder” above.</span>'));
    prev.classList.add('hidden');
  }

  function deleteRecursive(p) {
    var f = FS[p];
    if (!f) return;
    if (f.type === 'dir') f.children.slice().forEach(function (c) { deleteRecursive(join(p, c)); });
    var par = FS[parentOf(p)];
    if (par && par.children) par.children = par.children.filter(function (c) { return join(p, c) !== p && !(c === p.slice(p.lastIndexOf('/') + 1)); });
    delete FS[p];
  }

  function showPreview(path) {
    var f = FS[path];
    prev.classList.remove('hidden');
    if (!f) { prev.innerHTML = ''; return; }
    if (f.type === 'dir') {
      prev.innerHTML = '<div class="pv-title">' + esc(path) + '</div>' + f.children.length + ' items:\n' + f.children.map(esc).join('\n');
    } else {
      prev.innerHTML = '<div class="pv-title">' + esc(path) + ' &nbsp;·&nbsp; ' + fakeSize(path) + '</div>' + esc(f.content);
    }
  }

  $('.fb-back', body).addEventListener('click', function () {
    if (stack.length > 1) { stack.pop(); cwd = stack[stack.length - 1]; render(); }
  });
  $('.fb-up', body).addEventListener('click', function () {
    var p = parentOf(cwd); if (p !== null) nav(p);
  });

  function mkdir() {
    var inp = $('.fb-newname', body);
    var name = inp.value.trim();
    if (!name) { toast('Type a folder name first'); inp.focus(); return; }
    if (/[\/]/.test(name)) { toast('Folder names cannot contain /'); return; }
    var path = join(cwd, name);
    if (FS[path]) { toast('“' + name + '” already exists here'); return; }
    FS[path] = { type: 'dir', children: [] };
    FS[cwd].children.push(name);
    saveFS(); inp.value = ''; render();
    toast('Created ' + path);
  }
  $('.fb-mkdir', body).addEventListener('click', mkdir);
  $('.fb-newname', body).addEventListener('keydown', function (e) { if (e.key === 'Enter') mkdir(); });

  render();
}

/* ============================================================
   Part 07: Notes App — localStorage-persisted notes + .txt export.
   ============================================================ */
function launchNotes() {
  createWindow({ appId: 'notes', title: 'Notes', icon: 'notes', width: 680, height: 460, onMount: mountNotes });
}

function mountNotes(body) {
  var notes = Store.get('notes', [
    { id: 1, title: 'Welcome to Notes', text: 'This note lives in localStorage.\n\nType something, hit Save (or Ctrl+S), then refresh the page — it will still be here.\n\nSave also offers a .txt download via Export.', ts: Date.now() }
  ]);
  var selId = notes.length ? notes[0].id : null;

  body.innerHTML =
    '<div class="app-toolbar">' +
      '<button class="btn primary nb-save">Save</button>' +
      '<button class="btn nb-new">+ New</button>' +
      '<button class="btn nb-export">Export .txt</button>' +
      '<button class="btn danger nb-clear">Clear</button>' +
      '<button class="btn danger nb-del">Delete</button>' +
      '<span style="margin-left:auto;font-size:11.5px;color:var(--text-dim)" class="nb-status"></span>' +
    '</div>' +
    '<div style="display:flex;flex:1;overflow:hidden">' +
      '<div class="notes-list"></div>' +
      '<div class="notes-editor"><textarea spellcheck="false" placeholder="Start typing…"></textarea></div>' +
    '</div>';

  var list = $('.notes-list', body), ta = $('textarea', body), status = $('.nb-status', body);

  function persist() { Store.set('notes', notes); }
  function fmt(ts) {
    var d = new Date(ts);
    return MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function renderList() {
    list.innerHTML = '';
    notes.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (n) {
      var c = el('div', 'note-card' + (n.id === selId ? ' sel' : ''));
      c.innerHTML = '<b>' + esc(n.title || 'Untitled') + '</b><small>' + esc((n.text.split('\n')[0] || '').slice(0, 40)) + ' · ' + fmt(n.ts) + '</small>';
      c.addEventListener('click', function () { selId = n.id; renderAll(); });
      list.appendChild(c);
    });
    if (!notes.length) list.appendChild(el('div', null, '<div style="padding:10px;font-size:12px;color:var(--text-dim)">No notes yet.<br>Click “+ New”.</div>'));
  }
  function current() { for (var i = 0; i < notes.length; i++) if (notes[i].id === selId) return notes[i]; return null; }
  function renderAll() {
    renderList();
    var n = current();
    ta.value = n ? n.text : '';
    ta.disabled = !n;
    status.textContent = n ? 'Last saved ' + fmt(n.ts) : '';
  }

  $('.nb-save', body).addEventListener('click', function () {
    var n = current(); if (!n) { toast('No note selected'); return; }
    n.text = ta.value;
    n.title = (ta.value.split('\n')[0] || 'Untitled').slice(0, 40);
    n.ts = Date.now();
    persist(); renderAll(); toast('Note saved');
  });
  $('.nb-new', body).addEventListener('click', function () {
    var id = Date.now();
    notes.push({ id: id, title: 'New note', text: '', ts: Date.now() });
    selId = id; persist(); renderAll(); ta.focus();
  });
  $('.nb-clear', body).addEventListener('click', function () {
    var n = current(); if (!n) return;
    n.text = ''; ta.value = ''; toast('Editor cleared (use Delete to remove the note)');
  });
  $('.nb-del', body).addEventListener('click', function () {
    notes = notes.filter(function (n) { return n.id !== selId; });
    selId = notes.length ? notes[0].id : null;
    persist(); renderAll(); toast('Note deleted');
  });
  $('.nb-export', body).addEventListener('click', function () {
    var n = current(); if (!n) { toast('No note selected'); return; }
    var blob = new Blob([n.text], { type: 'text/plain' });
    var a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = (n.title || 'note').replace(/[^a-z0-9_\- ]/gi, '').slice(0, 40).trim().replace(/\s+/g, '_') + '.txt';
    D.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); D.body.removeChild(a); }, 500);
  });

  /* autosave while typing (debounced) so nothing is lost on refresh */
  var deb = null;
  ta.addEventListener('input', function () {
    clearTimeout(deb);
    deb = setTimeout(function () {
      var n = current(); if (!n) return;
      n.text = ta.value;
      n.title = (ta.value.split('\n')[0] || 'Untitled').slice(0, 40);
      n.ts = Date.now();
      persist(); renderList();
      status.textContent = 'Autosaved ' + fmt(n.ts);
    }, 500);
  });
  ta.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); $('.nb-save', body).click(); }
  });

  renderAll();
}

function launchCalendar() {
  createWindow({ appId: 'calendar', title: 'Calendar', icon: 'calendar', width: 640, height: 560, onMount: mountCalendar });

function mountCalendar(body) {
  var now = new Date();
  var viewY = now.getFullYear(), viewM = now.getMonth();
  var selKey = dateKey(now);
  var events = Store.get('events', {});

  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function persist() { Store.set('events', events); }

  body.innerHTML =
    '<div class="cal-wrap">' +
      '<div class="cal-head">' +
        '<div style="display:flex;gap:8px"><button class="btn cal-prev">&larr;</button><button class="btn cal-today">Today</button><button class="btn cal-next">&rarr;</button></div>' +
        '<h2 class="cal-title"></h2>' +
        '<div style="display:flex;gap:6px"><input class="text-input cal-ev-in" placeholder="Add event…" style="width:170px"><button class="btn primary cal-ev-add">Add</button></div>' +
      '</div>' +
      '<div class="cal-grid"></div>' +
      '<div class="cal-day-panel"></div>' +
    '</div>';

  var grid = $('.cal-grid', body), title = $('.cal-title', body), dayPanel = $('.cal-day-panel', body);

  function render() {
    title.textContent = MONTHS[viewM] + ' ' + viewY;
    grid.innerHTML = '';
    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function (d) { grid.appendChild(el('div', 'cal-dow', d)); });
    var first = new Date(viewY, viewM, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
    var daysPrev = new Date(viewY, viewM, 0).getDate();
    var todayKey = dateKey(new Date());
    for (var i = 0; i < 42; i++) {
      var dayNum, other = false, m = viewM, y = viewY;
      if (i < startDow) { dayNum = daysPrev - startDow + 1 + i; other = true; m = viewM - 1; if (m < 0) { m = 11; y--; } }
      else if (i - startDow < daysInMonth) { dayNum = i - startDow + 1; }
      else { dayNum = i - startDow - daysInMonth + 1; other = true; m = viewM + 1; if (m > 11) { m = 0; y++; } }
      var key = y + '-' + pad2(m + 1) + '-' + pad2(dayNum);
      var c = el('div', 'cal-cell' + (other ? ' other' : '') + (key === todayKey ? ' today' : '') + (key === selKey ? ' sel' : ''));
      c.textContent = dayNum;
      if (events[key] && events[key].length) c.appendChild(el('span', 'evt-dot'));
      (function (k, isOther) {
        c.addEventListener('click', function () { selKey = k; if (isOther) { var p = k.split('-'); viewY = +p[0]; viewM = +p[1] - 1; } render(); });
      })(key, other);
      grid.appendChild(c);
    }
    renderDay();
  }

  function renderDay() {
    dayPanel.innerHTML = '';
    var p = selKey.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    dayPanel.appendChild(el('h4', null, DAYS[d.getDay()] + ', ' + MONTHS[+p[1] - 1] + ' ' + (+p[2])));
    var evs = events[selKey] || [];
    if (!evs.length) dayPanel.appendChild(el('div', null, '<span style="font-size:12px;color:var(--text-dim)">No events. Type one above and hit Add.</span>'));
    evs.forEach(function (txt, idx) {
      var row = el('div', 'cal-ev');
      row.innerHTML = '<span style="color:var(--warn)">&#9679;</span><span>' + esc(txt) + '</span>';
      var x = el('button', null, '&#10005;');
      x.addEventListener('click', function () { evs.splice(idx, 1); if (!evs.length) delete events[selKey]; persist(); render(); });
      row.appendChild(x);
      dayPanel.appendChild(row);
    });
  }

  function addEvent() {
    var inp = $('.cal-ev-in', body), v = inp.value.trim();
    if (!v) { toast('Type an event first'); return; }
    (events[selKey] = events[selKey] || []).push(v);
    inp.value = ''; persist(); render(); toast('Event added to ' + selKey);
  }
  $('.cal-ev-add', body).addEventListener('click', addEvent);
  $('.cal-ev-in', body).addEventListener('keydown', function (e) { if (e.key === 'Enter') addEvent(); });
  $('.cal-prev', body).addEventListener('click', function () { viewM--; if (viewM < 0) { viewM = 11; viewY--; } render(); });
  $('.cal-next', body).addEventListener('click', function () { viewM++; if (viewM > 11) { viewM = 0; viewY++; } render(); });
  $('.cal-today', body).addEventListener('click', function () {
    var n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth(); selKey = dateKey(n); render();
  });

  /* seed a friendly event on the 1st of this month if calendar is brand new */
  var seedKey = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-01';
  if (!Object.keys(events).length) { events[seedKey] = ['Welcome to NebulaOS!']; persist(); }

  render();
}

/* ============================================================
   Part 10: Assistant / Terminal — commands, app search, system responses.
   ============================================================ */
var TERM_QUEUE = [];
function launchTerminalWith(cmd) {
  var existing = OS.windows.filter(function (w) { return w.appId === 'terminal'; })[0];
  if (cmd) TERM_QUEUE.push(cmd);
  if (existing) { focusWindow(existing); flushTermQueue(existing); return existing; }
  var win = createWindow({ appId: 'terminal', title: 'Assistant', icon: 'terminal', width: 640, height: 430, onMount: mountTerminal });
  flushTermQueue(win);
  return win;
}
function launchTerminal() { return launchTerminalWith(null); }
function flushTermQueue(win) {
  setTimeout(function () {
    while (TERM_QUEUE.length && win.body.isConnected) {
      var c = TERM_QUEUE.shift();
      var inp = $('.term-input', win.body);
      if (inp) { inp.value = c; submitTerm(win.body, win); }
    }
  }, 120);
}

function mountTerminal(body, win) {
  body.innerHTML =
    '<div class="term"></div>' +
    '<div class="term-input-row"><span class="term-prompt">nebula&gt;</span><input class="term-input" spellcheck="false" autocomplete="off" placeholder="Type a command or keyword — try /help"></div>';
  var term = $('.term', body), inp = $('.term-input', body);
  var history = [], hIdx = -1;

  function out(text, cls) {
    var lines = String(text).split('\n');
    lines.forEach(function (ln) {
      var l = el('div', 'term-line' + (cls ? ' ' + cls : ''));
      l.textContent = ln.length ? ln : ' ';
      term.appendChild(l);
    });
    term.scrollTop = term.scrollHeight;
  }

  win.termOut = out;
  out('NebulaOS Assistant v' + OS.version + ' — type /help for commands, or just words to search apps.', 'sys');
  out('Tip: /open tetris launches an app. /theme light switches the whole system.', 'sys');

  var WEATHER = [
    { c: 'Clear skies', t: 24, w: 'light breeze 6 km/h' },
    { c: 'Partly cloudy', t: 19, w: 'wind 12 km/h' },
    { c: 'Light rain', t: 15, w: 'humid, wind 9 km/h' },
    { c: 'Overcast', t: 17, w: 'still air' },
    { c: 'Sunny with a chance of dopamine', t: 27, w: 'breezy 15 km/h' }
  ];

  function cmdHelp() {
    out('COMMANDS', 'hdr');
    out('/help                this list');
    out('/time                current date and time');
    out('/weather             forecast for your location (simulated)');
    out('/apps                list all installed apps and games');
    out('/open <app>          launch an app or game');
    out('/theme <dark|light>  switch system theme');
    out('/wallpaper <name>    ' + Object.keys(WALLPAPERS).join(', '));
    out('/calc <expr>         quick math, e.g. /calc 12*(3+4)');
    out('/echo <text>         print text back');
    out('/whoami              who you are');
    out('/sysinfo             system information');
    out('/neofetch            stylish system art');
    out('/history             your command history');
    out('/clear               clear the screen');
  }
  function cmdCalc(expr) {
    try {
      if (!/^[\d\s+\-*\/().^%eE,]*$/.test(expr)) throw new Error('only numbers and operators');
      var safe = expr.replace(/\^/g, '**');
      var r = Function('"use strict";return (' + safe + ')')();
      if (typeof r !== 'number' || !isFinite(r)) throw new Error('not a finite number');
      out(expr + ' = ' + r, 'ok');
    } catch (e) { out('calc error: ' + e.message, 'err'); }
  }
  function cmdOpen(arg) {
    var q = arg.toLowerCase().trim();
    if (!q) { out('usage: /open <app>  (see /apps)', 'err'); return; }
    var hit = null;
    Object.keys(APPS).forEach(function (k) {
      var a = APPS[k];
      if (!hit && (k === q || a.name.toLowerCase() === q || a.name.toLowerCase().indexOf(q) === 0 || k.indexOf(q) === 0)) hit = k;
    });
    if (!hit) Object.keys(APPS).forEach(function (k) {
      var a = APPS[k];
      if (!hit && (a.name.toLowerCase().indexOf(q) >= 0 || k.indexOf(q) >= 0)) hit = k;
    });
    if (hit) { out('Launching ' + APPS[hit].name + '…', 'ok'); launchApp(hit); }
    else out('No app matches "' + arg + '". Try /apps.', 'err');
  }
  function searchApps(q) {
    var hits = Object.keys(APPS).map(function (k) { return APPS[k]; }).filter(function (a) {
      return a.name.toLowerCase().indexOf(q) >= 0 || a.id.indexOf(q) >= 0 || a.cat.toLowerCase().indexOf(q) >= 0;
    });
    if (!hits.length) { out('No apps match "' + q + '".', 'sys'); return; }
    out(hits.length + ' result(s):', 'hdr');
    hits.forEach(function (a) {
      out('  • ' + a.name + '  [' + a.cat + ']  → /open ' + a.id, 'acc');
    });
  }

  function run(raw) {
    var line = raw.trim();
    if (!line) return;
    history.push(line); hIdx = history.length;
    out('nebula> ' + line, 'ok');
    if (line.charAt(0) === '/') {
      var sp = line.indexOf(' ');
      var cmd = (sp < 0 ? line.slice(1) : line.slice(1, sp)).toLowerCase();
      var arg = sp < 0 ? '' : line.slice(sp + 1);
      switch (cmd) {
        case 'help': cmdHelp(); break;
        case 'time': {
          var n = new Date();
          out(DAYS[n.getDay()] + ', ' + MONTHS[n.getMonth()] + ' ' + n.getDate() + ', ' + n.getFullYear() + ' — ' + pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds()), 'ok');
          break; }
        case 'weather': {
          var wk = WEATHER[new Date().getDate() % WEATHER.length];
          out('Forecast (simulated, deterministic by date):', 'hdr');
          out('  ' + wk.c + ' — ' + wk.t + '°C, ' + wk.w);
          out('  Umbrella probability: ' + (wk.c.indexOf('rain') >= 0 ? 'high' : 'low') + '.');
          break; }
        case 'apps':
          out('INSTALLED SOFTWARE', 'hdr');
          Object.keys(APPS).forEach(function (k) {
            var a = APPS[k];
            out('  ' + pad((k), 14) + a.name + (a.special ? '  ★ special feature' : ''), 'acc');
          });
          break;
        case 'open': cmdOpen(arg); break;
        case 'theme':
          if (/^(dark|light)$/.test(arg.trim())) { applyTheme(arg.trim()); out('Theme set to ' + arg.trim() + '.', 'ok'); }
          else out('usage: /theme dark|light', 'err');
          break;
        case 'wallpaper':
          if (WALLPAPERS[arg.trim()]) { applyWallpaper(arg.trim()); out('Wallpaper set to ' + arg.trim() + '.', 'ok'); }
          else out('known wallpapers: ' + Object.keys(WALLPAPERS).join(', '), 'err');
          break;
        case 'calc': cmdCalc(arg); break;
        case 'echo': out(arg, null); break;
        case 'whoami': out('you@nebula — logged in as Guest (all privileges, zero responsibilities).', null); break;
        case 'sysinfo': {
          var up = Math.floor((Date.now() - OS.bootTime) / 1000);
          out('NebulaOS ' + OS.version, 'hdr');
          out('Kernel        nebula-web 1.0 (single-file edition)');
          out('Host          ' + navigator.userAgent.slice(0, 60));
          out('Screen        ' + D.documentElement.clientWidth + 'x' + D.documentElement.clientHeight);
          out('Windows open  ' + OS.windows.length);
          out('Uptime        ' + Math.floor(up / 60) + 'm ' + (up % 60) + 's');
          out('Storage       localStorage ' + (Store.get ? 'enabled' : 'memory fallback'));
          break; }
        case 'neofetch':
          out('      ╱╲        you@nebula', 'acc');
          out('     ╱  ╲       ────────────', 'acc');
          out('    ╱ ╱╲ ╲      OS: NebulaOS ' + OS.version, 'acc');
          out('   ╱ ╱  ╲ ╲     Apps: ' + Object.keys(APPS).length + ' (5 sys, 5 games, 1 special)', 'acc');
          out('   ╲ ╲  ╱ ╱     Theme: ' + OS.settings.theme + ', wallpaper: ' + OS.settings.wallpaper, 'acc');
          out('    ╲ ╲╱ ╱      Windows: ' + OS.windows.length + ' open', 'acc');
          out('      ╲╱        Uptime: ' + Math.floor((Date.now() - OS.bootTime) / 1000) + 's', 'acc');
          break;
        case 'history': history.forEach(function (h, i) { out(' ' + pad2(i + 1) + '  ' + h, 'sys'); }); break;
        case 'clear': term.innerHTML = ''; break;
        default: out('Unknown command: /' + cmd + ' — try /help', 'err');
      }
    } else {
      searchApps(line.toLowerCase());
    }
  }

  function pad(s, n) { s = String(s); while (s.length < n) s += ' '; return s; }

  function submit() {
    var v = inp.value; inp.value = '';
    run(v);
  }
  win.submitTerm = submit;
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submit();
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (history.length) { hIdx = Math.max(0, hIdx - 1); inp.value = history[hIdx] || ''; } }
    else if (e.key === 'ArrowDown') { e.preventDefault(); hIdx = Math.min(history.length, hIdx + 1); inp.value = history[hIdx] || ''; }
  });
  body.addEventListener('pointerdown', function (e) { if (!e.target.closest('.term-line')) setTimeout(function () { inp.focus(); }, 10); });
  setTimeout(function () { inp.focus(); }, 80);
}

function submitTerm(body, win) { if (win && win.submitTerm) win.submitTerm(); }

// ===== 11-calc.js =====
/* ============================================================
   Part 11: ★ SPECIAL FEATURE — Quantum Calculator.
   A scientific calculator with a persistent history tape, memory
   register (MS/MR/M+/MC), full keyboard control, and clickable
   history reuse. Chosen because every OS needs one great utility.
   ============================================================ */
function launchCalc() {
  createWindow({ appId: 'calc', title: 'Quantum Calc', icon: 'calc', width: 380, height: 560, onMount: mountCalc });
}

function mountCalc(body, win) {
  var acc = 0, pending = null, pendingOp = null, fresh = true, exprStr = '';
  var mem = Store.get('calcMem', 0);
  var hist = Store.get('calcHist', []);

  body.innerHTML =
    '<div class="calc">' +
      '<div class="calc-screen"><div class="calc-expr"></div><div class="calc-acc">0</div></div>' +
      '<div class="calc-history"></div>' +
      '<div class="calc-keys"></div>' +
    '</div>';

  var accEl = $('.calc-acc', body), exprEl = $('.calc-expr', body), histEl = $('.calc-history', body), keys = $('.calc-keys', body);

  function fmt(n) {
    if (!isFinite(n)) return n > 0 ? '∞' : (n < 0 ? '-∞' : 'NaN');
    if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
    var s = n.toPrecision(10).replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }
  function render() {
    accEl.textContent = fmt(acc);
    exprEl.textContent = exprStr + (pending !== null && pendingOp ? ' ' + pendingOp : '') + (mem !== 0 ? '   [M:' + fmt(mem) + ']' : '');
    histEl.innerHTML = '';
    hist.slice(-40).reverse().forEach(function (h) {
      var d = el('div', null, esc(h.e) + ' = ' + esc(h.r));
      d.addEventListener('click', function () { acc = h.r; fresh = true; render(); toast('Reused ' + h.r); });
      histEl.appendChild(d);
    });
  }
  function pushHist(e, r) {
    hist.push({ e: e, r: fmt(r) });
    if (hist.length > 200) hist = hist.slice(-200);
    Store.set('calcHist', hist);
  }

  function inputDigit(d) {
    if (fresh) { acc = 0; fresh = false; }
    if (d === '.' && String(acc).indexOf('.') >= 0) return;
    var neg = acc < 0;
    var s = (neg ? '-' : '') + String(Math.abs(acc));
    s = (s === '0' && d !== '.') || s === '-0' ? '' : s;
    var num = parseFloat((s + d));
    acc = isNaN(num) ? 0 : num;
    render();
  }
  function applyOp(a, b, op) {
    switch (op) {
      case '+': return a + b; case '-': return a - b; case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b; case '^': return Math.pow(a, b);
      case 'mod': return b === 0 ? NaN : a % b;
    }
    return b;
  }
  function setOp(op) {
    if (pending !== null && pendingOp && !fresh) {
      var r = applyOp(pending, acc, pendingOp);
      if (!isFinite(r)) { errorState(); return; }
      pushHist(fmt(pending) + ' ' + pendingOp + ' ' + fmt(acc), r);
      pending = r; acc = r;
    } else {
      pending = acc;
    }
    pendingOp = op; fresh = true;
    exprStr = fmt(pending) + ' ' + op;
    render();
  }
  function equals() {
    if (pending === null || !pendingOp) return;
    var r = applyOp(pending, acc, pendingOp);
    if (!isFinite(r)) { errorState(); return; }
    pushHist(exprStr + ' ' + fmt(acc), r);
    exprStr = exprStr + ' ' + fmt(acc) + ' =';
    acc = r; pending = null; pendingOp = null; fresh = true;
    render();
  }
  function errorState() {
    accEl.textContent = 'Error'; exprEl.textContent = 'cannot compute — press C';
    acc = 0; pending = null; pendingOp = null; fresh = true;
  }
  function unary(fn, label) {
    var r = fn(acc);
    if (!isFinite(r)) { errorState(); return; }
    exprStr = label + '(' + fmt(acc) + ')';
    acc = r; fresh = true; render();
  }

  var KEYMAP = [
    ['MC', 'fn'], ['MR', 'fn'], ['MS', 'fn'], ['M+', 'fn'], ['C', 'fn'],
    ['sin', 'fn'], ['cos', 'fn'], ['tan', 'fn'], ['ln', 'fn'], ['log', 'fn'],
    ['√', 'fn'], ['x²', 'fn'], ['x^y', 'fn'], ['π', 'fn'], ['e', 'fn'],
    ['7', 'num'], ['8', 'num'], ['9', 'num'], ['%', 'op'], ['⌫', 'fn'],
    ['4', 'num'], ['5', 'num'], ['6', 'num'], ['÷', 'op'], ['(', 'fn'],
    ['1', 'num'], ['2', 'num'], ['3', 'num'], ['×', 'op'], [')', 'fn'],
    ['0', 'num'], ['.', 'num'], ['±', 'fn'], ['−', 'op'], ['+', 'op'],
    ['n!', 'fn'], ['mod', 'op'], ['Ans', 'fn'], ['=', 'eq', 2]
  ];
  var lastAns = 0;

  KEYMAP.forEach(function (k) {
    var b = el('button', 'calc-key ' + k[1], k[0]);
    if (k[2]) b.style.gridColumn = 'span ' + k[2];
    b.setAttribute('data-k', k[0]);
    b.addEventListener('click', function () { press(k[0]); });
    keys.appendChild(b);
  });

  function press(k) {
    if (/^[0-9]$/.test(k)) return inputDigit(k);
    switch (k) {
      case '.': return inputDigit('.');
      case '+': return setOp('+');
      case '−': return setOp('-');
      case '×': return setOp('*');
      case '÷': return setOp('/');
      case 'mod': return setOp('mod');
      case 'x^y': return setOp('^');
      case '=': lastAns = acc; return equals();
      case 'C': acc = 0; pending = null; pendingOp = null; fresh = true; exprStr = ''; return render();
      case '⌫': {
        if (fresh) return;
        var s = String(acc);
        acc = s.length <= 1 || (s.length === 2 && s.charAt(0) === '-') ? 0 : parseFloat(s.slice(0, -1));
        if (isNaN(acc)) acc = 0;
        return render();
      }
      case '±': acc = -acc; return render();
      case '%': acc = acc / 100; exprStr = fmt(acc) + '%'; return render();
      case '√': return unary(Math.sqrt, '√');
      case 'x²': return unary(function (x) { return x * x; }, 'sqr');
      case 'sin': return unary(function (x) { return Math.sin(x * Math.PI / 180); }, 'sin');
      case 'cos': return unary(function (x) { return Math.cos(x * Math.PI / 180); }, 'cos');
      case 'tan': return unary(function (x) { return Math.tan(x * Math.PI / 180); }, 'tan');
      case 'ln': return unary(function (x) { if (x <= 0) return NaN; return Math.log(x); }, 'ln');
      case 'log': return unary(function (x) { if (x <= 0) return NaN; return Math.log10(x); }, 'log');
      case 'n!': return unary(function (x) {
        if (x < 0 || x !== Math.floor(x) || x > 170) return NaN;
        var r = 1; for (var i = 2; i <= x; i++) r *= i; return r;
      }, 'fact');
      case 'π': acc = Math.PI; fresh = true; exprStr = 'π'; return render();
      case 'e': acc = Math.E; fresh = true; exprStr = 'e'; return render();
      case 'Ans': acc = lastAns; fresh = true; exprStr = 'Ans'; return render();
      case 'MC': mem = 0; Store.set('calcMem', mem); return render();
      case 'MR': acc = mem; fresh = true; exprStr = 'M'; return render();
      case 'MS': mem = acc; Store.set('calcMem', mem); return render();
      case 'M+': mem += acc; Store.set('calcMem', mem); return render();
      case '(': case ')': exprStr += k; return render();
    }
  }

  /* full keyboard control while the calc window is focused */
  function keyHandler(e) {
    if (!body.isConnected) return D.removeEventListener('keydown', keyHandler);
    if (D.activeElement && /INPUT|TEXTAREA/.test(D.activeElement.tagName)) return;
    if (!OS.focused || OS.focused.appId !== 'calc') return;
    var k = e.key;
    if (/^[0-9]$/.test(k)) { press(k); e.preventDefault(); return; }
    var map = { '+': '+', '-': '−', '*': '×', '/': '÷', '.': '.', '^': 'x^y', '(': '(', ')': ')', '%': '%' };
    if (map[k]) { press(map[k]); e.preventDefault(); return; }
    if (k === 'Enter' || k === '=') { press('='); e.preventDefault(); return; }
    if (k === 'Backspace') { press('⌫'); e.preventDefault(); return; }
    if (k === 'Escape') { press('C'); e.preventDefault(); return; }
    if (k.toLowerCase() === 'r') { press('MR'); e.preventDefault(); }
    if (k.toLowerCase() === 's') { press('MS'); e.preventDefault(); }
  }
  D.addEventListener('keydown', keyHandler);
  win.onClose = function () { D.removeEventListener('keydown', keyHandler); };

  render();
}

          '<li><b>Memory register:</b> MC / MR / MS / M+ with the value shown on the display and persisted between sessions.</li>' +
